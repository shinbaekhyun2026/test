<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>신백현중학교 온라인 교무실</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Noto Sans KR', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
     
        html, body {
            background-color: #0f172a !important;
            color: #ffffff;
            min-height: 100vh;
        }
     
        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            padding: 20px 0;
            overflow-x: hidden;
        }
     
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(59, 130, 246, 0.15), rgba(15, 23, 42, 0.8));
            z-index: 0;
            pointer-events: none;
        }
     
        header {
            text-align: center;
            margin-top: 15px;
            margin-bottom: 20px;
            z-index: 1;
            padding: 0 15px;
        }
     
        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #60a5fa;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            word-break: keep-all;
        }
     
        header p {
            font-size: 0.88rem;
            color: #94a3b8;
            word-break: keep-all;
        }
     
        main {
            width: 100%;
            max-width: 600px;
            padding: 0 16px;
            z-index: 1;
        }

        /* 3번 방식: 노션 캘린더 실시간 임베드 프레임 박스 */
        .notion-embed-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(248, 113, 113, 0.35);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px -5px rgba(0, 0, 0, 0.4);
        }

        .notion-embed-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .notion-embed-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.92rem;
            font-weight: 700;
            color: #fca5a5;
        }

        .notion-embed-link {
            color: #94a3b8;
            font-size: 0.78rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .notion-embed-link:hover {
            background: rgba(248, 113, 113, 0.2);
            color: #ffffff;
        }

        .notion-frame-wrapper {
            width: 100%;
            height: 280px; /* 높이 조절 가능 */
            border-radius: 10px;
            overflow: hidden;
            background: #ffffff;
        }

        .notion-frame-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 메인 2x2 그리드 카드 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            justify-content: center;
        }
     
        .office-card {
            background-color: #1e293b;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 28px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-decoration: none;
            color: #ffffff;
            box-shadow: 0 8px 20px -5px rgba(0, 0, 0, 0.4);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
     
        .office-card:hover {
            transform: translateY(-4px);
            background-color: #334155;
            background: rgba(51, 65, 85, 0.8);
            border-color: rgba(96, 165, 250, 0.5);
            box-shadow: 0 15px 25px -8px rgba(59, 130, 246, 0.3);
        }
     
        .office-card:active {
            transform: scale(0.96);
            background-color: #334155;
        }
     
        .icon-box {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
     
        .card-title {
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            word-break: keep-all;
            line-height: 1.3;
            color: #ffffff;
        }
     
        .c-calendar { color: #f87171; }
        .c-treasure { color: #facc15; }
        .c-classroom { color: #2dd4bf; }
        .c-comtime { color: #38bdf8; }

        footer {
            margin-top: 40px;
            padding: 15px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
            z-index: 1;
        }
     
        @media (max-width: 480px) {
            header h1 { font-size: 1.5rem; }
            .grid-container { gap: 12px; }
            .office-card { padding: 22px 12px; border-radius: 16px; }
            .icon-box { width: 48px; height: 48px; font-size: 22px; }
            .card-title { font-size: 14px; }
            .notion-frame-wrapper { height: 240px; }
        }
    </style>
</head>
<body>
     
    <div class="bg-overlay"></div>
     
    <header>
        <h1>🏫 신백현중학교 온라인 교무실</h1>
        <p>원하시는 업무 메뉴를 선택하시면 바로 연결됩니다.</p>
    </header>
     
    <main>
        <!-- 3번 방식: 노션 캘린더 실시간 임베드 박스 -->
        <section class="notion-embed-card">
            <div class="notion-embed-header">
                <div class="notion-embed-title">
                    <i class="fa-solid fa-calendar-days c-calendar"></i>
                    <span>실시간 학교 캘린더</span>
                </div>
                <a href="https://plausible-clave-a20.notion.site/3d8930617c3f80399197cea8e06b1a7b?v=3d8930617c3f80c58b03000cd06654bf&source=copy_link" 
                   target="_blank" rel="noopener noreferrer" class="notion-embed-link">
                    <span>전체화면</span>
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            </div>

            <!-- 노션 캘린더 프레임 -->
            <div class="notion-frame-wrapper">
                <iframe src="https://plausible-clave-a20.notion.site/3d8930617c3f80399197cea8e06b1a7b?v=3d8930617c3f80c58b03000cd06654bf&source=copy_link" 
                        loading="lazy" 
                        title="신백현중학교 노션 캘린더">
                </iframe>
            </div>
        </section>

        <!-- 2x2 메인 메뉴 그리드 -->
        <div class="grid-container">
            <!-- 1. 오늘의 일정 (학교 노션 캘린더 바로가기) -->
            <a href="https://plausible-clave-a20.notion.site/3d8930617c3f80399197cea8e06b1a7b?v=3d8930617c3f80c58b03000cd06654bf&source=copy_link" 
               target="_blank" rel="noopener noreferrer" class="office-card">
                <div class="icon-box c-calendar"><i class="fa-solid fa-calendar-days"></i></div>
                <span class="card-title">오늘의 일정<br>(학교 캘린더)</span>
            </a>
     
            <!-- 2. 보물창고 -->
            <a href="https://docs.google.com/spreadsheets/d/1Q6N_aM4Oy8IAHlOX8BEabyekh6Yho-xalQV8CbwfbkY/edit?gid=1872786866#gid=1872786866" 
               target="_blank" rel="noopener noreferrer" class="office-card">
                <div class="icon-box c-treasure"><i class="fa-solid fa-box-archive"></i></div>
                <span class="card-title">보물창고</span>
            </a>
     
            <!-- 3. 구글 클래스룸 -->
            <a href="https://edu.google.com/intl/ALL_kr/workspace-for-education/products/classroom/" 
               target="_blank" rel="noopener noreferrer" class="office-card">
                <div class="icon-box c-classroom"><i class="fa-solid fa-chalkboard-user"></i></div>
                <span class="card-title">구글 클래스룸</span>
            </a>
     
            <!-- 4. 컴시간 알리미 -->
            <a href="http://xn--s39aqy283b66bj2x.kr/" 
               target="_blank" rel="noopener noreferrer" class="office-card">
                <div class="icon-box c-comtime"><i class="fa-solid fa-clock"></i></div>
                <span class="card-title">컴시간 알리미</span>
            </a>
        </div>
    </main>
     
    <footer>
        <p>© 2026 신백현중학교 온라인 교무실 System</p>
    </footer>

</body>
</html>
