<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>신백현중학교 온라인 교무실</title>
    <!-- 파비콘 에러 방지용 기본 아이콘 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏫</text></svg>">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Noto Sans KR', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            background-color: #0f172a !important;
            color: #ffffff;
            min-height: 100vh;
        }
        
        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            padding: 20px 0;
            overflow-x: hidden;
        }
        
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(59, 130, 246, 0.15), rgba(15, 23, 42, 0.8));
            z-index: 0;
            pointer-events: none;
        }
        
        header {
            text-align: center;
            margin-top: 15px;
            margin-bottom: 20px;
            z-index: 1;
            padding: 0 15px;
        }
        
        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #60a5fa;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            word-break: keep-all;
        }
        
        header p {
            font-size: 0.88rem;
            color: #94a3b8;
            word-break: keep-all;
        }
        
        main {
            width: 100%;
            max-width: 600px;
            padding: 0 16px;
            z-index: 1;
        }

        /* 1. 상단 실시간 자동 연동 전광판 */
        .ticker-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(248, 113, 113, 0.35);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 20px -5px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .ticker-card:hover {
            border-color: rgba(248, 113, 113, 0.7);
            transform: translateY(-2px);
        }

        .ticker-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #fca5a5;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 8px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .ticker-wrapper {
            flex: 1;
            overflow: hidden;
            position: relative;
            white-space: nowrap;
            display: flex;
            align-items: center;
        }

        .ticker-content {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: ticker 20s linear infinite;
            font-size: 0.88rem;
            color: #e2e8f0;
        }

        .ticker-card:hover .ticker-content {
            animation-play-state: paused;
        }

        .ticker-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-right: 36px;
        }

        .ticker-item .time {
            color: #f87171;
            font-weight: 700;
        }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .ticker-link {
            color: #94a3b8;
            font-size: 0.8rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            flex-shrink: 0;
            transition: all 0.2s ease;
            white-space: nowrap;
            cursor: pointer;
        }

        .ticker-link:hover {
            background: rgba(248, 113, 113, 0.2);
            color: #ffffff;
        }

        /* 2. 2x2 메인 메뉴 그리드 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            justify-content: center;
        }
        
        .office-card {
            background-color: #1e293b;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 28px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-decoration: none;
            color: #ffffff;
            box-shadow: 0 8px 20px -5px rgba(0, 0, 0, 0.4);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        
        .office-card:hover {
            transform: translateY(-4px);
            background-color: #334155;
            background: rgba(51, 65, 85, 0.8);
            border-color: rgba(96, 165, 250, 0.5);
            box-shadow: 0 15px 25px -8px rgba(59, 130, 246, 0.3);
        }
        
        .office-card:active {
            transform: scale(0.96);
            background-color: #334155;
        }
        
        .icon-box {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .card-title {
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            word-break: keep-all;
            line-height: 1.3;
            color: #ffffff;
        }
        
        .c-calendar { color: #f87171; }
        .c-treasure { color: #facc15; }
        .c-classroom { color: #2dd4bf; }
        .c-comtime { color: #38bdf8; }

        /* 3. 모달 팝업 스타일 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-card {
            background: #1e293b;
            border: 1px solid rgba(248, 113, 113, 0.4);
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
            transform: scale(0.9);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header h2 {
            font-size: 1.25rem;
            color: #fca5a5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #94a3b8;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
        }

        .modal-close-btn:hover {
            background: rgba(248, 113, 113, 0.2);
            color: #ffffff;
        }

        .modal-body {
            max-height: 320px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
        }

        .modal-schedule-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .modal-schedule-item .time-badge {
            color: #f87171;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .modal-schedule-item .content-text {
            color: #e2e8f0;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        footer {
            margin-top: 40px;
            padding: 15px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
            z-index: 1;
        }
        
        @media (max-width: 480px) {
            header h1 { font-size: 1.5rem; }
            .grid-container { gap: 12px; }
            .office-card { padding: 22px 12px; border-radius: 16px; }
            .icon-box { width: 48px; height: 48px; font-size: 22px; }
            .card-title { font-size: 14px; }
        }
    </style>
</head>
<body>
        
    <div class="bg-overlay"></div>
        
    <header>
        <h1>🏫 신백현중학교 온라인 교무실</h1>
        <p>원하시는 업무 메뉴를 선택하시면 바로 연결됩니다.</p>
    </header>
        
    <main>
        <!-- 상단 실시간 자동 연동 전광판 (클릭 시 팝업 오픈) -->
        <div class="ticker-card" onclick="openScheduleModal()">
            <div class="ticker-badge" id="tickerDateBadge">
                <i class="fa-solid fa-bullhorn"></i> TODAY
            </div>
            <div class="ticker-wrapper">
                <div class="ticker-content" id="tickerContainer">
                    <span class="ticker-item"><span class="time">[안내]</span> 실시간 학사 일정을 불러오는 중입니다...</span>
                </div>
            </div>
            <a href="https://app.notion.com/p/3d8930617c3f80399197cea8e06b1a7b?v=3d8930617c3f80c58b03000cd06654bf" target="_blank" rel="noopener noreferrer" class="ticker-link" onclick="event.stopPropagation()">
                <span>이동</span>
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>
        </div>

        <!-- 2x2 메인 메뉴 그리드 -->
        <div class="grid-container">
            <!-- 1. 오늘의 일정 -->
            <a href="https://app.notion.com/p/3d8930617c3f80399197cea8e06b1a7b?v=3d8930617c3f80c58b03000cd06654bf" target="_blank" rel="noopener noreferrer" class="office-card">
                <div class="icon-box c-calendar"><i class="fa-solid fa-calendar-days"></i></div>
                <span class="card-title">오늘의 일정<br>(노션 캘린더)</span>
            </a>
        
            <!-- 2. 보물창고 -->
            <a href="https://docs.google.com/spreadsheets/d/1Q6N_aM4Oy8IAHlOX8BEabyekh6Yho-xalQV8CbwfbkY/edit?gid=1872786866#gid=1872786866" target="_blank" rel="noopener noreferrer" class="office-card">
                <div class="icon-box c-treasure"><i class="fa-solid fa-box-archive"></i></div>
                <span class="card-title">보물창고</span>
            </a>
        
            <!-- 3. 구글 클래스룸 -->
            <a href="https://edu.google.com/intl/ALL_kr/workspace-for-education/products/classroom/" target="_blank" rel="noopener noreferrer" class="office-card">
                <div class="icon-box c-classroom"><i class="fa-solid fa-chalkboard-user"></i></div>
                <span class="card-title">구글 클래스룸</span>
            </a>
        
            <!-- 4. 컴시간 알리미 -->
            <a href="http://xn--s39aqy283b66bj2x.kr/" target="_blank" rel="noopener noreferrer" class="office-card">
                <div class="icon-box c-comtime"><i class="fa-solid fa-clock"></i></div>
                <span class="card-title">컴시간 알리미</span>
            </a>
        </div>
    </main>
        
    <footer>
        <p>© 2026 신백현중학교 온라인 교무실 System</p>
    </footer>

    <!-- 4. 개인별 일정 모달 팝업 구조 -->
    <div class="modal-overlay" id="scheduleModal" onclick="closeScheduleModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2><i class="fa-solid fa-calendar-check"></i> 오늘의 상세 일정</h2>
                <button class="modal-close-btn" onclick="closeScheduleModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="modal-body" id="modalScheduleList">
                <div class="modal-schedule-item">
                    <span class="time-badge">[안내]</span>
                    <span class="content-text">일정을 불러오는 중입니다...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const VERCEL_API_URL = "https://test1-eh7j.vercel.app/api/today";
        let loadedSchedules = [];

        async function fetchNotionSchedule() {
            const container = document.getElementById('tickerContainer');
            const badgeEl = document.getElementById('tickerDateBadge');

            const today = new Date();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const date = String(today.getDate()).padStart(2, '0');
            if (badgeEl) {
                badgeEl.innerHTML = `<i class="fa-solid fa-bullhorn"></i> ${month}/${date}`;
            }

            try {
                const response = await fetch(VERCEL_API_URL);

                if (!response.ok) {
                    throw new Error(`HTTP 에러 발생! 상태 코드: ${response.status}`);
                }

                const data = await response.json();
                const schedules = data.schedules || data.data || (Array.isArray(data) ? data : []);

                if (Array.isArray(schedules) && schedules.length > 0) {
                    loadedSchedules = schedules;
                    container.innerHTML = schedules.map(item => {
                        const time = item.time || item.date || '학사일정';
                        const text = item.text || item.title || item.name || JSON.stringify(item);
                        return `<span class="ticker-item"><span class="time">[${time}]</span> ${text}</span>`;
                    }).join('');
                    renderModalList(schedules);
                } else {
                    showDefaultTicker(container);
                }
            } catch (error) {
                console.warn("노션 일정 불러오기 지연/오류:", error);
                showDefaultTicker(container);
            }
        }

        function showDefaultTicker(container) {
            const defaultText = [
                { time: "학사일정", text: "오늘 등록된 주요 학사일정이 없습니다." },
                { time: "안내", text: "우측 '이동' 버튼을 누르면 전체 캘린더 페이지로 연결됩니다." }
            ];
            loadedSchedules = defaultText;
            container.innerHTML = defaultText.map(item => 
                `<span class="ticker-item"><span class="time">[${item.time}]</span> ${item.text}</span>`
            ).join('');
            renderModalList(defaultText);
        }

        function renderModalList(schedules) {
            const modalList = document.getElementById('modalScheduleList');
            modalList.innerHTML = schedules.map(item => {
                const time = item.time || item.date || '학사일정';
                const text = item.text || item.title || item.name || '';
                return `
                    <div class="modal-schedule-item">
                        <span class="time-badge">[${time}]</span>
                        <span class="content-text">${text}</span>
                    </div>
                `;
            }).join('');
        }

        function openScheduleModal() {
            const modal = document.getElementById('scheduleModal');
            modal.classList.add('active');
        }

        function closeScheduleModal(event) {
            if (!event || event.target === document.getElementById('scheduleModal') || event.currentTarget.classList.contains('modal-close-btn')) {
                const modal = document.getElementById('scheduleModal');
                modal.classList.remove('active');
            }
        }

        document.addEventListener('DOMContentLoaded', fetchNotionSchedule);
    </script>
</body>
</html>
